<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>境界TRPG Ultimate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header><h1>境界TRPG</h1><p>Ultimate Standalone Edition</p></header>
<section id="status" class="panel"></section>
<section id="output" class="panel output"></section>
<section class="command-area">
<div id="suggestions" class="suggestions hidden"></div>
<form id="command-form">
<input id="command-input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="/help">
<button type="submit">実行</button>
</form>
<small>「/」で候補　↑↓選択　Tab補完　Enter実行</small>
</section>
</div>

<!-- Firebaseを追加：app.jsより前に置く -->
<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

  import {
    getDatabase,
    ref,
    set,
    get,
    update,
    onValue,
    remove
  } from
    "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

  // Firebase Consoleから取得した設定をここに貼る
  const firebaseConfig = {
    apiKey: "AIzaSyDuWTYGj8aeQvs1ulbhW1pxPmAJ195wTZg",
    authDomain: "trpg-c798c.firebaseapp.com",
    databaseURL: "https://console.firebase.google.com/u/0/project/trpg-c798c/database/trpg-c798c-default-rtdb/data/~2F?hl=ja",
    projectId: "trpg-c798c",
    storageBucket: "trpg-c798c.firebasestorage.app",
    messagingSenderId: "395870734652",
    appId: "1:395870734652:web:fd987c041ac037708e7639"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const database = getDatabase(firebaseApp);

  // app.jsから使えるようにする
  window.firebaseDB = database;
  window.firebaseRef = ref;
  window.firebaseSet = set;
  window.firebaseGet = get;
  window.firebaseUpdate = update;
  window.firebaseOnValue = onValue;
  window.firebaseRemove = remove;
</script>

<script src="app.js"></script>
</body>
</html>
